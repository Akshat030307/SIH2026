[project]
name = "smartscan"
version = "0.1.0"
description = "Smart Scan Strategy for Electronic Warfare (SIH26055): ML-driven ESM receiver scheduler"
authors = [
    { name = "Akshat Chowdhary", email = "akshatchowdhary03@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.141.1",
    "gymnasium>=1.3.0",
    "hdbscan>=0.8.44",
    "matplotlib>=3.11.2",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
